# ============================================================
#  .github/workflows/release.yml
#
#  Se activa al hacer push de un tag v*.*.*  (ej: git tag v1.1.0)
#    1. Compila Xtuber en Mac Apple Silicon e Intel (→ .dmg)
#    2. Compila Xtuber en Windows (→ .exe)
#    3. Crea un GitHub Release y sube los archivos
#
#  También se puede lanzar a mano desde la pestaña Actions
#  (workflow_dispatch): compila y deja los artefactos sin publicar.
# ============================================================

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Xtuber-mac-${{ matrix.arch }}
          path: dist/Xtuber-mac-${{ matrix.arch }}.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: .\build_windows.bat
        shell: cmd

      - name: Renombrar exe
        run: Move-Item dist\Xtuber.exe dist\Xtuber-windows.exe
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: Xtuber-windows
          path: dist/Xtuber-windows.exe

  release:
    name: Crear Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: "Xtuber ${{ github.ref_name }}"
          body: |
            ## Xtuber ${{ github.ref_name }}

            | Plataforma | Archivo |
            |---|---|
            | 🍎 Mac con Apple Silicon (M1/M2/M3/M4) | `Xtuber-mac-arm64.dmg` |
            | 🍎 Mac con Intel | `Xtuber-mac-x86_64.dmg` |
            | 🪟 Windows | `Xtuber-windows.exe` |

            **Instalación**
            - **Mac**: abre el `.dmg` y arrastra `Xtuber.app` a Aplicaciones. La primera vez: clic derecho → Abrir (o Ajustes del Sistema → Privacidad y seguridad → "Abrir igualmente").
            - **Windows**: ejecuta `Xtuber-windows.exe`. Si SmartScreen avisa: "Más información" → "Ejecutar de todas formas".

            > yt-dlp, ffmpeg y deno van incluidos. yt-dlp se actualiza solo en segundo plano.
          files: |
            artifacts/Xtuber-mac-arm64/Xtuber-mac-arm64.dmg
            artifacts/Xtuber-mac-x86_64/Xtuber-mac-x86_64.dmg
            artifacts/Xtuber-windows/Xtuber-windows.exe
